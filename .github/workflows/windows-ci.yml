name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke import desktop UI
        run: python -c "import aidevteam.ui; print('PySide6 UI import OK')"

      - name: Build Windows app
        if: github.event_name != 'pull_request'
        run: pyinstaller --noconfirm --clean --windowed --name "AI Dev Team" main.py

      - name: Upload Windows build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: AI-Dev-Team-Windows
          path: dist/AI Dev Team/
          if-no-files-found: error
          retention-days: 14
